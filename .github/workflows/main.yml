name: AI Assistant CI & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: 3.9

    - name: Run Assistant Test
      run: |
        echo -e "help\nexit" | python3 assistant.py

    - name: Package Assistant for Release
      run: zip -r palmon-assistant.zip assistant.py data

    - name: Upload Assistant Artifact
      uses: actions/upload-artifact@v3
      with:
        name: palmon-assistant-release
        path: palmon-assistant.zip
